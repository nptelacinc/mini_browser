<!DOCTYPE html>
<html>
<head>
    <title>VK World Admin Panel</title>
    <meta charset="UTF-8">

    <style>
        body{
            font-family: Arial;
            padding:20px;
            background:#f5f5f5;
        }

        .box{
            background:white;
            padding:20px;
            border-radius:10px;
            max-width:600px;
            margin:auto;
        }

        input,button{
            padding:10px;
            margin:5px;
        }

        button{
            cursor:pointer;
        }

        .pdf-item{
            background:#eee;
            padding:10px;
            margin-top:10px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<div class="box">

<h2>📚 VK World Admin Panel</h2>

<form id="pdfForm">

<input
type="text"
name="title"
placeholder="PDF Title"
required>

<br>

<input
type="file"
name="pdf"
required>

<br>

<button type="submit">
Upload PDF
</button>

</form>

<hr>

<h3>Uploaded PDFs</h3>

<div id="pdfList">
Loading...
</div>

</div>

<script>

document.getElementById("pdfForm")
.addEventListener("submit", async (e) => {

e.preventDefault();

const formData = new FormData(e.target);

const res = await fetch("/admin/upload-pdf", {
method:"POST",
body:formData
});

const data = await res.json();

alert(data.message);

loadPDFs();

});

async function loadPDFs(){

const res = await fetch("/api/pdfs");

const pdfs = await res.json();

let html = "";

pdfs.forEach(pdf => {

html += `
<div class="pdf-item">

<b>${pdf.title}</b>

<br><br>

<a href="${pdf.fileUrl}" target="_blank">
Open PDF
</a>

&nbsp;&nbsp;

<button onclick="deletePDF('${pdf._id}')">
Delete
</button>

</div>
`;

});

document.getElementById("pdfList").innerHTML = html;

}

async function deletePDF(id){

const res = await fetch(
"/admin/delete-pdf/" + id,
{
method:"DELETE"
}
);

const data = await res.json();

alert(data.message);

loadPDFs();

}

loadPDFs();

</script>

</body>
</html>
